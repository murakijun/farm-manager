{% extends "base.html" %}
{% block title %}{{ '編集' if house else '新規ハウス' }} – 農場 木管理{% endblock %}
{% block content %}

<div class="mb-3">
  <a href="{{ url_for('house_detail', house_id=house.id) if house else url_for('index') }}"
     class="btn btn-farm-outline">
    <i class="bi bi-arrow-left me-1"></i>戻る
  </a>
</div>

<div class="card">
  <div class="card-header py-3">
    <h4 class="mb-0">
      <i class="bi bi-{{ 'pencil' if house else 'plus-circle' }}-fill me-2"></i>
      {{ 'ハウスを編集' if house else '新しいハウスを追加' }}
    </h4>
  </div>
  <div class="card-body p-4">
    <form method="POST">
      <div class="mb-4">
        <label class="form-label fw-bold fs-5">ハウス名 <span class="text-danger">*</span></label>
        <input type="text" name="name" class="form-control form-control-lg"
               placeholder="例：第1ハウス" value="{{ house.name if house else '' }}" required>
      </div>

      {% if not house %}
      <div class="row g-3 mb-4">
        <div class="col-6">
          <label class="form-label fw-bold">列数（縦）</label>
          <input type="number" name="rows" class="form-control form-control-lg text-center"
                 min="1" max="50" value="5">
          <div class="form-text">縦に何列ありますか？</div>
        </div>
        <div class="col-6">
          <label class="form-label fw-bold">1列あたりの本数（横）</label>
          <input type="number" name="cols" class="form-control form-control-lg text-center"
                 min="1" max="100" value="10">
          <div class="form-text">1列に何本ありますか？</div>
        </div>
      </div>
      {% endif %}

      <div class="mb-4">
        <label class="form-label fw-bold">メモ</label>
        <textarea name="notes" class="form-control" rows="3"
                  placeholder="このハウスについての説明など">{{ house.notes if house else '' }}</textarea>
      </div>

      <button type="submit" class="btn btn-farm btn-lg w-100">
        <i class="bi bi-check-lg me-1"></i>
        {{ '保存する' if house else 'ハウスを作成する' }}
      </button>
    </form>
  </div>
</div>
{% endblock %}
