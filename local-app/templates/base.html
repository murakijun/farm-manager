<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>{% block title %}農場 木管理{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --green-dark: #2d6a4f;
      --green-mid:  #40916c;
      --green-light:#74c69d;
      --leaf:       #b7e4c7;
      --soil:       #8d6346;
    }
    body { background: #f4f9f4; font-family: 'Helvetica Neue', sans-serif; }

    /* ナビ */
    .navbar { background: var(--green-dark) !important; }
    .navbar-brand { font-size: 1.3rem; font-weight: bold; letter-spacing: .05em; }

    /* カード */
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
    .card-header { background: var(--green-dark); color: #fff; border-radius: 12px 12px 0 0 !important; }

    /* ボタン */
    .btn-farm   { background: var(--green-dark); color:#fff; border-radius:8px; }
    .btn-farm:hover { background: var(--green-mid); color:#fff; }
    .btn-farm-outline { border:2px solid var(--green-dark); color:var(--green-dark); border-radius:8px; }
    .btn-farm-outline:hover { background:var(--green-dark); color:#fff; }
    .btn { min-height: 44px; }

    /* 木ステータスバッジ */
    .badge-normal  { background:#28a745; }
    .badge-caution { background:#fd7e14; }
    .badge-sick    { background:#dc3545; }
    .badge-dead    { background:#6c757d; }

    /* グリッド */
    .tree-grid { overflow-x: auto; }
    .tree-grid table { border-collapse: separate; border-spacing: 6px; }
    .tree-cell {
      width: 56px; height: 56px;
      border-radius: 10px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform .1s;
      text-align: center;
      vertical-align: middle;
      font-size: .65rem;
      font-weight: bold;
      color: #fff;
      position: relative;
    }
    .tree-cell:hover { transform: scale(1.08); }
    .tree-cell.normal  { background: #28a745; border-color: #1e7e34; }
    .tree-cell.caution { background: #fd7e14; border-color: #e06600; }
    .tree-cell.sick    { background: #dc3545; border-color: #b02a37; }
    .tree-cell.dead    { background: #adb5bd; border-color: #868e96; }

    /* 作業グリッド */
    .work-cell {
      width: 56px; height: 56px;
      border-radius: 10px;
      cursor: pointer;
      font-size: .65rem;
      font-weight: bold;
      text-align: center;
      vertical-align: middle;
      transition: transform .1s;
    }
    .work-cell:hover { transform: scale(1.08); }
    .work-cell.done     { background: #28a745; color:#fff; border: 2px solid #1e7e34; }
    .work-cell.not-done { background: #fff;    color:#555; border: 2px dashed #adb5bd; }

    /* フラッシュ */
    .alerts-wrap { position: fixed; top: 70px; right: 16px; z-index: 9999; width: 300px; }

    /* 写真ギャラリー */
    .photo-thumb { width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; }

    /* ラベル行 */
    .row-label {
      width: 32px;
      font-size: .75rem;
      color: #6c757d;
      font-weight: bold;
      text-align: center;
    }

    /* スマホ最適化 */
    @media (max-width: 576px) {
      .tree-cell, .work-cell { width: 48px; height: 48px; font-size: .55rem; }
    }
  </style>
</head>
<body>

<!-- ナビ -->
<nav class="navbar navbar-dark px-3">
  <a class="navbar-brand text-white" href="/">
    <i class="bi bi-tree-fill me-2"></i>農場 木管理
  </a>
  <a href="/" class="btn btn-sm btn-outline-light">
    <i class="bi bi-house-fill me-1"></i>ホーム
  </a>
</nav>

<!-- フラッシュメッセージ -->
<div class="alerts-wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
    <div class="alert alert-{{ cat }} alert-dismissible fade show shadow" role="alert">
      {{ msg }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
  {% endwith %}
</div>

<!-- メインコンテンツ -->
<div class="container-fluid px-3 py-4" style="max-width:960px;">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // フラッシュ自動消去
  setTimeout(() => {
    document.querySelectorAll('.alert').forEach(el => {
      bootstrap.Alert.getOrCreateInstance(el).close();
    });
  }, 3000);
</script>
{% block scripts %}{% endblock %}
</body>
</html>
